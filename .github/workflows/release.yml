name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tag pushes don't trigger the go workflow, so run the full gate here.
  checks:
    uses: ./.github/workflows/go.yml

  goreleaser:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore signing certificate via OIDC, and persisting the attestation.
      # artifact-metadata isn't needed: storage records require push-to-registry.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Published binaries must not depend on a restored build cache.
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sha256sums.txt
