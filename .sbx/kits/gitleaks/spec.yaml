schemaVersion: "2"
kind: mixin
name: gitleaks
description: Gitleaks secret scanning CLI, plus the repo's tracked .githooks as the active git hooksPath

args:
  gitleaks_version:
    default: "v8.30.1"

permissions:
  network:
    allow:
      - proxy.golang.org
      - sum.golang.org
      - ports.ubuntu.com
      - archive.ubuntu.com
      - security.ubuntu.com

setup:
  install:
    - description: Install Go if the template does not ship it
      command: "command -v go >/dev/null || (apt-get update && apt-get install -y --no-install-recommends golang-go)"
      user: "0"
    - description: Add ~/go/bin to PATH
      command: "grep -q 'go/bin' /etc/sandbox-persistent.sh || echo 'export PATH=\"$PATH:$HOME/go/bin\"' >> /etc/sandbox-persistent.sh"
      user: "0"
    - description: Install pinned gitleaks
      command: "go install github.com/zricethezav/gitleaks/v8@${{ kit.args.gitleaks_version }}"
      user: "1000"
    - description: Point git hooksPath at the repo's tracked .githooks directory
      command: "git -C \"$WORKSPACE_DIR\" config core.hooksPath .githooks"
      user: "1000"
